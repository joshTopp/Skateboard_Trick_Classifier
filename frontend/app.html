<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skateboard Trick Predictor</title>
    <!-- Tailwind CSS for quick, clean styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

    <div class="bg-white p-8 rounded-xl shadow-md w-96">
        <h1 class="text-2xl font-bold mb-4 text-gray-800 text-center">Skate Trick AI</h1>
        <p class="text-sm text-gray-500 mb-6 text-center">Upload a video (max 10s) to classify the trick.</p>

        <form id="uploadForm" class="space-y-4">
            <div>
                <input type="file" id="videoFile" accept="video/*" required
                    class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
            </div>

            <button type="submit" id="submitBtn"
                class="w-full bg-blue-600 text-white py-2 px-4 rounded-lg font-medium hover:bg-blue-700 transition">
                Upload & Predict
            </button>
        </form>

        <!-- Loading state -->
        <div id="loading" class="hidden mt-4 text-center text-blue-600 font-medium">
            Processing video... Please wait 🛹
        </div>

        <!-- Result Box -->
        <div id="resultBox" class="hidden mt-6 p-4 rounded-lg bg-gray-50 border border-gray-200">
            <h3 class="font-bold text-gray-700 mb-2">Result:</h3>
            <p id="resultText" class="text-sm text-gray-600 space-y-1"></p>
        </div>
    </div>

    <script>
        const form = document.getElementById('uploadForm');
        const videoFile = document.getElementById('videoFile');
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const resultBox = document.getElementById('resultBox');
        const resultText = document.getElementById('resultText');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const file = videoFile.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append("file", file);

            // UI states
            submitBtn.disabled = true;
            loading.classList.remove('hidden');
            resultBox.classList.add('hidden');

            try {
                // Adjust port if your FastAPI backend runs on a different port (e.g., 8000)
                const response = await fetch('http://localhost:8000/send_video', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Something went wrong.");
                }

                // Show success results
                resultText.innerHTML = `
                    <p><span class="font-semibold">Trick:</span> <span class="text-green-600 font-bold uppercase">${data.prediction_label}</span></p>
                    <p><span class="font-semibold">Duration:</span> ${data.duration_seconds}s</p>
                    <p><span class="font-semibold">File:</span> ${data.filename}</p>
                `;
                resultBox.classList.remove('hidden');
            } catch (err) {
                // Show error message
                resultText.innerHTML = `<p class="text-red-500"><span class="font-semibold">Error:</span> ${err.message}</p>`;
                resultBox.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                loading.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
